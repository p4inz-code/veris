packages:
  - "packages/*"
  - "packages/plugin-sdk"
  - "tools/*"
# pnpm 9 (pinned via packageManager) — no dependency postinstall scripts are
# approved. esbuild ships platform binaries via optionalDependencies and
# better-sqlite3 ships prebuilds, so builds work without postinstall scripts.
# An explicit empty list also prevents pnpm's interactive build prompt on
# fresh installs (non-interactive in CI).
onlyBuiltDependencies: []
